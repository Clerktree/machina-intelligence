[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "machina-harness"
version = "0.1.0"
description = "Open-source predictive-maintenance and machine-intelligence harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=1.26",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
train = ["scikit-learn>=1.7.2,<1.8", "pandas>=2.2", "datasets>=2.20", "huggingface_hub>=0.24"]
mcp = ["mcp>=1.0"]
runtime = ["scikit-learn>=1.7.2,<1.8", "joblib>=1.4"]
agent = ["transformers>=4.46", "peft>=0.13", "accelerate>=1.0", "torch>=2.4"]

[tool.setuptools.packages.find]
where = ["src"]
